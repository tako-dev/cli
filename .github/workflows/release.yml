name: CLI release

# 打 tag 触发：git tag v0.x.y && git push --tags
# 流程：三平台 × 三客户端 e2e 全过 → build / unit / pre-release → npm publish
on:
  push:
    tags:
      - "v*"

jobs:
  e2e:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        client: [codex, pi, pi-web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Installer e2e
        uses: ./.github/actions/installer-e2e
        with:
          client: ${{ matrix.client }}

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cli

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check npm publishing CLI
        run: npx -y npm@11.5.1 --version

      - name: Build
        run: bun run build

      - name: Smoke test built bundle
        run: |
          OUTPUT=$(bun dist/index.js --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Tako CLI" || (echo "FAIL: bundle cannot start" && exit 1)

      - name: Unit tests
        run: bun run test:unit

      - name: Pre-release checks
        run: bun run test:pre-release

      - name: Publish to npm (OIDC trusted publishing)
        run: npx -y npm@11.5.1 publish --provenance --access public
