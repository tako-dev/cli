name: CLI CI

# PR / push 日常门禁：三平台 unit + platform，Ubuntu 再跑 build / pre-release。
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cli

      - name: Unit tests
        run: bun run test:unit

      - name: Platform tests
        run: bun run test:platform

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cli

      - name: Build
        run: bun run build

      - name: Smoke test built bundle
        run: |
          OUTPUT=$(bun dist/index.js --version)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Tako CLI" || (echo "FAIL: bundle cannot start" && exit 1)

      - name: Pre-release checks
        run: bun run test:pre-release
