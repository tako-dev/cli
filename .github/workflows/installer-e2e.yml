name: CLI installer e2e

# 真实安装 Codex / Pi / Pi Web，验证 INV-INST-01/02/03。
# 手动触发 + nightly。发布前必须通过。
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        client: [codex, pi, pi-web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Installer e2e
        uses: ./.github/actions/installer-e2e
        with:
          client: ${{ matrix.client }}
