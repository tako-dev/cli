name: Installer e2e
description: Set up bun, install deps, and run the installer e2e driver for one client.

inputs:
  client:
    description: Client id to install (codex, pi, pi-web)
    required: false
    default: codex

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-cli
      with:
        tako-home: ${{ runner.temp }}/tako-e2e

    - name: Run installer e2e
      shell: bash
      env:
        TAKO_HOME: ${{ runner.temp }}/tako-e2e
        TAKO_E2E_CLIENT: ${{ inputs.client }}
      run: bun tests/e2e/installer-driver.ts
